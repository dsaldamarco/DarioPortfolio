<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a1f"/>
      <stop offset=".45" stop-color="#22145a"/>
      <stop offset=".72" stop-color="#7a2a86"/>
      <stop offset="1" stop-color="#ff6b8b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".45" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb3c8" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#ff5f9e" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff5f9e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2d8c"/>
      <stop offset="1" stop-color="#2a1550"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1a5e"/>
      <stop offset="1" stop-color="#130b2e"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c2c"/>
      <stop offset="1" stop-color="#05040d"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1d6b"/>
      <stop offset="1" stop-color="#090616"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cf2ff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#5cf2ff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#9b7bff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sunClip"><circle cx="400" cy="360" r="132"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="800" height="640" fill="url(#sky)"/>

  <!-- aurora -->
  <path d="M-20 170 C 160 90, 300 220, 460 130 S 720 80, 830 150 L 830 210 C 700 150, 560 250, 420 200 S 140 170, -20 240 Z" fill="url(#aurora)" filter="url(#blur)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="62" cy="48" r="1.6" opacity=".9"/><circle cx="140" cy="96" r="1.1" opacity=".7"/>
    <circle cx="212" cy="38" r="1.8"/><circle cx="268" cy="118" r="1" opacity=".6"/>
    <circle cx="330" cy="62" r="1.3" opacity=".8"/><circle cx="420" cy="30" r="1.1" opacity=".7"/>
    <circle cx="486" cy="88" r="1.7"/><circle cx="552" cy="44" r="1.2" opacity=".8"/>
    <circle cx="612" cy="110" r="1" opacity=".6"/><circle cx="680" cy="56" r="1.9"/>
    <circle cx="742" cy="102" r="1.2" opacity=".7"/><circle cx="96" cy="176" r="1" opacity=".5"/>
    <circle cx="178" cy="210" r="1.3" opacity=".6"/><circle cx="640" cy="190" r="1.1" opacity=".55"/>
    <circle cx="720" cy="228" r="1.4" opacity=".6"/><circle cx="36" cy="120" r="1" opacity=".6"/>
    <circle cx="380" cy="150" r="1" opacity=".5"/><circle cx="770" cy="24" r="1.2" opacity=".8"/>
  </g>
  <g fill="#fff">
    <path d="M212 30 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".9"/>
    <path d="M680 46 l1.6 5 5 1.6 -5 1.6 -1.6 5 -1.6 -5 -5 -1.6 5 -1.6z"/>
    <path d="M486 80 l1.4 4.4 4.4 1.4 -4.4 1.4 -1.4 4.4 -1.4 -4.4 -4.4 -1.4 4.4 -1.4z" opacity=".85"/>
  </g>

  <!-- sun -->
  <circle cx="400" cy="360" r="230" fill="url(#glow)"/>
  <g clip-path="url(#sunClip)">
    <rect x="260" y="220" width="280" height="280" fill="url(#sun)"/>
    <g fill="#7a2a86">
      <rect x="260" y="372" width="280" height="5"/>
      <rect x="260" y="392" width="280" height="7"/>
      <rect x="260" y="414" width="280" height="9"/>
      <rect x="260" y="438" width="280" height="11"/>
      <rect x="260" y="464" width="280" height="14"/>
    </g>
  </g>

  <!-- ring -->
  <ellipse cx="400" cy="360" rx="200" ry="34" fill="none" stroke="#ffe0f0" stroke-opacity=".45" stroke-width="2.5" transform="rotate(-12 400 360)"/>

  <!-- mountains -->
  <path d="M0 430 L90 360 L150 400 L240 320 L320 400 L360 380 L410 420 L480 340 L560 410 L640 350 L720 400 L800 360 L800 520 L0 520 Z" fill="url(#far)" opacity=".9"/>
  <path d="M0 470 L70 420 L130 450 L210 380 L290 460 L350 440 L420 470 L500 400 L580 460 L650 420 L730 470 L800 430 L800 540 L0 540 Z" fill="url(#mid)"/>
  <path d="M240 320 L265 345 L250 343 L240 352 L228 342 L218 346 Z" fill="#c9a6ff" opacity=".35"/>
  <path d="M480 340 L500 362 L488 360 L480 368 L470 360 L462 364 Z" fill="#c9a6ff" opacity=".3"/>

  <!-- water -->
  <rect x="0" y="500" width="800" height="140" fill="url(#water)"/>
  <g fill="#ffc46b">
    <rect x="330" y="512" width="140" height="3" rx="1.5" opacity=".7"/>
    <rect x="350" y="526" width="100" height="3" rx="1.5" opacity=".55"/>
    <rect x="368" y="540" width="64" height="2.5" rx="1.25" opacity=".45"/>
    <rect x="382" y="553" width="36" height="2" rx="1" opacity=".35"/>
    <rect x="392" y="565" width="16" height="2" rx="1" opacity=".25"/>
  </g>

  <!-- foreground -->
  <path d="M0 520 L60 470 L110 500 L150 480 L200 520 Z" fill="url(#near)"/>
  <path d="M800 520 L740 460 L690 495 L650 478 L600 520 Z" fill="url(#near)"/>
</svg>
